<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pentru Jasmine 💌</title>
<style>
:root{--bg1:#ffe3ec;--bg2:#ffc2d6;--ink:#8a1c4a;--card:#fffaf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1028;--bg2:#5c1840;--ink:#ffd6e7;--card:#4a1633}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2));font-family:Georgia,'Times New Roman',serif;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center}
.shine{background:linear-gradient(90deg,#ff2d75,#ffd166,#fff,#ff8fb8,#ff2d75);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sh 3s linear infinite;filter:drop-shadow(0 0 6px rgba(255,105,160,.6))}
@keyframes sh{to{background-position:300% 0}}
.fall,.burst{position:fixed;pointer-events:none;z-index:1;user-select:none}
.fall{top:-40px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.burst{z-index:50;animation:bu 1.6s ease-out forwards}
@keyframes bu{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.3);opacity:0}}
#intro{z-index:5;display:flex;flex-direction:column;align-items:center;gap:22px;transition:opacity .6s}
#intro h1{font-size:clamp(26px,7vw,40px);margin:0;padding:0 16px}
.env{position:relative;width:min(280px,72vw);height:min(185px,48vw);cursor:pointer;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.env .back,.env .front{position:absolute;inset:0;border-radius:10px}
.env .back{background:#f4a3bf;box-shadow:0 14px 30px rgba(138,28,74,.35)}
.env .front{background:linear-gradient(135deg,#ffc2d6 50%,#ffb0cb 50%);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#ff8fb8;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s;z-index:4}
.env .heart{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);font-size:34px;z-index:5;transition:opacity .3s}
.env.open{animation:none}.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .heart{opacity:0}
#hint{font-size:16px;opacity:.8}
#card{position:fixed;z-index:10;width:min(440px,90vw);background:var(--card);border-radius:22px;padding:30px 22px 34px;box-shadow:0 20px 60px rgba(138,28,74,.45);opacity:0;transform:translateY(120px) scale(.6);pointer-events:none;transition:all .9s cubic-bezier(.2,1.2,.3,1);min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#card.show{opacity:1;transform:none;pointer-events:auto}
#q{font-size:clamp(24px,6.5vw,34px);margin:0;line-height:1.25}
#btns{display:flex;align-items:center;justify-content:center;gap:18px;min-height:130px;width:100%}
button{font:inherit;font-size:20px;border:0;border-radius:999px;padding:12px 28px;cursor:pointer;transition:transform .35s cubic-bezier(.3,1.4,.4,1),opacity .35s;color:#fff}
#da{background:linear-gradient(135deg,#ff2d75,#ff7aa8);box-shadow:0 6px 18px rgba(255,45,117,.5)}
#nu{background:#9a8a92}
#end{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:radial-gradient(circle,var(--bg1),var(--bg2))}
#end h2{font-size:clamp(30px,9vw,52px);margin:0}
#end p{font-size:22px;margin:0}
</style>
</head>
<body>
<div id="intro">
  <h1 class="shine">Am ceva pentru tine, Jasmine 💌</h1>
  <div class="env" id="env"><div class="back"></div><div class="flap"></div><div class="front"></div><div class="heart">💗</div></div>
  <div id="hint">Atinge plicul ✨</div>
</div>
<div id="card">
  <h2 id="q" class="shine"></h2>
  <div id="btns"><button id="da">Da</button><button id="nu">Nu</button></div>
</div>
<div id="end">
  <h2 class="shine">Știam că vei spune da! ❤️</h2>
  <p class="shine">Te ador, Jasmine ✨</p>
</div>
<script>
var F=['🌸','🌷','🌹','💮','🌺','🌼','🌻'],B=F.concat(['💖','💕','⭐','✨','💗']);
var Q=['Mă placi?','Știi cât de specială ești pentru mine?','Vrei să fii iubita mea?'];
var qi=0,nuN=0;
function fall(){
  var e=document.createElement('div');e.className='fall';e.textContent=F[Math.random()*F.length|0];
  e.style.left=Math.random()*100+'vw';e.style.fontSize=(16+Math.random()*22)+'px';
  e.style.animationDuration=(5+Math.random()*5)+'s';
  document.body.appendChild(e);setTimeout(function(){e.remove()},10500);
}
setInterval(fall,350);for(var i=0;i<10;i++)setTimeout(fall,i*120);
function burst(x,y,n){
  for(var i=0;i<n;i++){
    var e=document.createElement('div');e.className='burst';e.textContent=B[Math.random()*B.length|0];
    var a=Math.random()*Math.PI*2,d=120+Math.random()*(Math.min(innerWidth,innerHeight)*.6);
    e.style.left=x+'px';e.style.top=y+'px';e.style.fontSize=(18+Math.random()*24)+'px';
    e.style.setProperty('--dx',Math.cos(a)*d+'px');e.style.setProperty('--dy',(Math.sin(a)*d-60)+'px');
    e.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.appendChild(e);setTimeout(function(el){el.remove()},1700,e);
  }
}
var env=document.getElementById('env'),card=document.getElementById('card'),
    da=document.getElementById('da'),nu=document.getElementById('nu'),q=document.getElementById('q');
env.addEventListener('click',function(){
  if(env.classList.contains('open'))return;
  env.classList.add('open');
  var r=env.getBoundingClientRect();
  setTimeout(function(){burst(r.left+r.width/2,r.top+r.height/2,60)},500);
  setTimeout(function(){document.getElementById('intro').style.opacity=0;showQ();card.classList.add('show')},1300);
  setTimeout(function(){document.getElementById('intro').style.display='none'},2000);
});
function showQ(){
  q.textContent=Q[qi];nuN=0;
  da.style.transform='scale(1)';nu.style.transform='scale(1)';nu.style.opacity=1;nu.style.display='';
}
nu.addEventListener('click',function(){
  nuN++;
  var s=Math.max(.2,1-nuN*.18);
  da.style.transform='scale('+(1+nuN*.45)+')';
  nu.style.transform='scale('+s+')';
  if(nuN>=5){nu.style.opacity=0;setTimeout(function(){nu.style.display='none'},350)}
});
da.addEventListener('click',function(e){
  burst(e.clientX,e.clientY,18);
  qi++;
  if(qi<Q.length){showQ();return}
  card.classList.remove('show');
  setTimeout(function(){
    document.getElementById('end').style.display='flex';
    var c=0,t=setInterval(function(){burst(Math.random()*innerWidth,Math.random()*innerHeight,14);if(++c>25)clearInterval(t)},250);
  },500);
});
</script>
</body>
</html>
